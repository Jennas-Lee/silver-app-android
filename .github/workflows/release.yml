name: Release

# v0.1.0 같은 태그를 push하면 서명된 APK/AAB를 만들어 GitHub Release에 올린다
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ github.ref_name }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      DEVICE_TOKEN: ${{ secrets.DEVICE_TOKENS }}
      SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME#v}" >> "$GITHUB_ENV"

      - run: ./gradlew testReleaseUnitTest assembleRelease bundleRelease

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/silver-app-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/silver-app-${GITHUB_REF_NAME}.aab"
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
